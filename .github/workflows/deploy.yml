name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Configure wrangler.toml"
        run: |
          sed -i 's|your-domain.example|fakeyou.eu.org|g' wrangler.toml
          sed -i 's|REPLACE_WITH_YOUR_KV_NAMESPACE_ID|${{ secrets.KV_NAMESPACE_ID }}|' wrangler.toml
          echo "--- effective wrangler.toml ---"
          cat wrangler.toml

      - name: "Install dependencies"
        run: npm install --no-audit --no-fund

      - name: "Deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
